name: CI

on:
  pull_request:

  push:
    branches: [main, production-hardening]

  workflow_dispatch:

  schedule:
    - cron: '27 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: test
  DATABASE_URL: ''
  TEST_DATABASE_URL: ''
  PYTHON_DOTENV_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: python -m pip install -r requirements-dev.txt

      - name: Syntax, static safety and offline migration consistency/render
        run: python -B scripts/ci_checks.py

      - name: Isolated regression suites (no DB, Redis or providers)
        run: python -B scripts/ci_tests.py

  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # pgvector/pgvector:0.8.1-pg17, pinned by digest. Disposable, CI-only.
        image: pgvector/pgvector@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_USER: probe
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U probe -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      # conftest creates and drops a fresh ci_test_run_<uuid> database per run.
      TEST_DATABASE_URL: postgresql://probe@127.0.0.1:5432/ci_test
      # Offline placeholders: every provider is mocked or simulated, and the
      # benchmark refuses non-loopback sockets. No paid API can be called.
      VOYAGE_API_KEY: offline
      DEEPSEEK_API_KEY: offline
      DATALAB_API_KEY: offline
      CLOUDINARY_URL: cloudinary://offline:offline@offline
      GOOGLE_CLIENT_ID: offline.apps.googleusercontent.com
      JWT_SECRET_KEY: offline-test-secret-offline-test-secret-0001
      PYTHONDONTWRITEBYTECODE: '1'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: python -m pip install -r requirements-dev.txt

      - name: PostgreSQL + pgvector integration suites
        run: >-
          python -m pytest -p no:cacheprovider -q
          tests/test_embedding_bulk_update_postgres.py
          tests/test_vector_retrieval_postgres.py
          tests/test_document_processing_claim_postgres.py
          tests/test_summary_concurrency_postgres.py
          tests/test_resource_admission_postgres.py

      - name: Processing benchmark baseline and missing-image tracking (simulated providers)
        # Own process: the benchmark configures its environment at collection.
        run: >-
          python -m pytest -p no:cacheprovider -q
          tests/test_processing_benchmark_postgres.py
          tests/test_missing_images_postgres.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-test-client.apps.googleusercontent.com

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: node --test tests/*.test.mjs

      - run: npx --no-install tsc --noEmit

      - run: npm run lint -- --max-warnings 19

      - run: npm run build

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - run: python -m pip install pip-audit==2.10.1

      - name: Python dependencies (including transitive and test dependencies)
        run: python -m pip_audit --strict -r backend/requirements-dev.txt --progress-spinner off

      - name: Frontend lockfile (including dev dependencies)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=critical

  workflow-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Actions syntax, expressions and shell commands
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Build backend runtime image (no application startup)
        run: docker build --tag assistant-ci backend

      - name: Check non-root image identity (no services or providers)
        run: test "$(docker run --rm --network none --entrypoint id assistant-ci -u)" = '10001'