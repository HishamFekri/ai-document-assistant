name: CI

on:
  pull_request:

  push:
    branches: [main, production-hardening]

  workflow_dispatch:

  schedule:
    - cron: '27 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: test
  DATABASE_URL: ''
  TEST_DATABASE_URL: ''
  PYTHON_DOTENV_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: python -m pip install -r requirements-dev.txt

      - name: Syntax, static safety and offline migration consistency/render
        run: python -B scripts/ci_checks.py

      - name: Isolated regression suites (no DB, Redis or providers)
        run: python -B scripts/ci_tests.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-test-client.apps.googleusercontent.com

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: node --test tests/*.test.mjs

      - run: npx --no-install tsc --noEmit

      - run: npm run lint -- --max-warnings 19

      - run: npm run build

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - run: python -m pip install pip-audit==2.10.1

      - name: Python dependencies (including transitive and test dependencies)
        run: python -m pip_audit --strict -r backend/requirements-dev.txt --progress-spinner off

      - name: Frontend lockfile (including dev dependencies)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high

  workflow-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Actions syntax, expressions and shell commands
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Build backend runtime image (no application startup)
        run: docker build --tag assistant-ci backend

      - name: Check non-root image identity (no services or providers)
        run: test "$(docker run --rm --network none --entrypoint id assistant-ci -u)" = '10001'